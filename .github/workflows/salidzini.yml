name: Salidzini XML

on:
  schedule:
    - cron: "30 4 * * *"   # katru dienu ~06:30 Rīgas laikā
  workflow_dispatch:        # poga "Run workflow" palaišanai ar roku

permissions:
  contents: write

concurrency:
  group: salidzini
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ģenerē XML
        run: python salidzini_feed.py
      - name: Saglabā XML repozitorijā (GitHub Pages to publicē)
        run: |
          touch .nojekyll
          date -u +"%Y-%m-%d %H:%M UTC" > last-run.txt
          tail -n 50 salidzini_feed.log > feed-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salidzini-lv.xml last-run.txt feed-log.txt .nojekyll
          git commit -m "Salidzini XML atjaunots $(date -u +%F)" || echo "nav izmaiņu"
          git push
