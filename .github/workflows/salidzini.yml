name: Salidzini XML

on:
  schedule:
    - cron: "30 4 * * *"   # katru dienu ~06:30 Rīgas laikā
  workflow_dispatch:        # poga "Run workflow" palaišanai ar roku

permissions:
  contents: write

concurrency:
  group: salidzini
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ģenerē XML (Salidzini.lv)
        run: python salidzini_feed.py
      - name: Ģenerē XML (Kaina24.lt)
        continue-on-error: true   # LT kļūda neaptur Salidzini faila atjaunošanu
        env:                      # ja GitHub Secrets ir iestatīti — precīzs atlikums (> 0) un <stock>
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: python kaina24_feed.py
      - name: Saglabā XML repozitorijā (GitHub Pages to publicē)
        run: |
          touch .nojekyll
          date -u +"%Y-%m-%d %H:%M UTC" > last-run.txt
          tail -n 50 salidzini_feed.log > feed-log.txt || true
          tail -n 50 kaina24_feed.log > kaina24-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salidzini-lv.xml last-run.txt feed-log.txt .nojekyll
          git add kaina24-lt.xml kaina24-log.txt || true
          git commit -m "XML atjaunots $(date -u +%F)" || echo "nav izmaiņu"
          git push
